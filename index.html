---
layout: default
title: 首页
---

<div class="home">

  <h1 class="page-heading">每周小报列表</h1>

  <ul class="post-list">
    {%- for post in site.posts -%}
    <li>
      <h3>
        <a class="post-link" href="{{ post.url | relative_url }}">
          {{ post.title | escape }}
        </a>
      </h3>
      <p class="post-meta">
        <time datetime="{{ post.date | date_to_xmlschema }}">
          {{ post.date | date: "%Y年%m月%d日" }}
        </time>
      </p>
      {%- if post.excerpt -%}
        <div class="post-excerpt">
          {{ post.excerpt }}
        </div>
      {%- endif -%}
    </li>
    {%- endfor -%}
  </ul>

</div>
